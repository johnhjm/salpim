# 매주 월요일 아침, 실제 사이트를 브라우저로 열어 전체 기능을 점검하고 결과를 저장한다.
# 결과 파일: tools/data/check-results.json (살핌 주간 점검 예약 작업이 읽는다)
name: 전체 기능 점검

on:
  schedule:
    - cron: "10 23 * * 0" # 한국 시간 월요일 08:10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 브라우저 준비
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: 점검할 주소 정하기 (도메인을 정하기 전에는 임시 주소)
        id: url
        run: |
          URL=$(node -e "const m=require('fs').readFileSync('tools/build.mjs','utf8').match(/const SITE_URL = \"([^\"]*)\"/); console.log((m&&m[1])||'https://salpim.pages.dev')")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: 전체 기능 점검
        run: node tools/check.mjs "${{ steps.url.outputs.url }}" || true
      - name: 결과 저장
        run: |
          git config user.name "살핌 점검"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data/check-results.json
          git diff --cached --quiet && exit 0
          git commit -m "주간 점검 결과 $(TZ=Asia/Seoul date +%F) [skip ci]"
          git pull --rebase
          git push
